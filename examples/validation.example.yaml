schema_version: 2

# Illustrative engineering limits only.
# Replace these values with limits appropriate to the tested cell, pack,
# operating state, and validation plan.
limits:
  cell_voltage:
    min_v: 2.8
    max_v: 4.2
    max_delta_v: 0.08

  temperature:
    min_c: -20
    max_c: 55

# Analysis semantics, not a battery safety limit.
# Consecutive failing samples separated by more than this gap start
# separate violation events.
event_detection:
  max_gap_s: 2.0

# Required-data policy. `strict` preserves fail-fast behavior.
# Use `exclude_invalid_rows` only when structured exclusion evidence is desired.
data_quality:
  mode: strict

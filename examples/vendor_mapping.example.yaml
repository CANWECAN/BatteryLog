schema_version: 4

# Illustrative engineering limits only.
limits:
  cell_voltage:
    min_v: 2.8
    max_v: 4.2
    max_delta_v: 0.08
  temperature:
    min_c: -20
    max_c: 45
  pack_current:
    charge_max_a: 100
    discharge_max_a: 200
    positive_direction: discharge

event_detection:
  max_gap_s: 2.0

signals:
  timestamp: Time_s
  pack_current: PackCurrent
  pack_voltage: PackVoltage
  cell_voltage:
    pattern: 'BMS_CellVoltage_(?P<index>\d+)'
  temperature:
    pattern: 'T_Module_(?P<index>\d+)'

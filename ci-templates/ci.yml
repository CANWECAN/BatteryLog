name: BatteryLog CI
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  plan:
    name: Plan CI
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      full: ${{ steps.select.outputs.full }}
      windows: ${{ steps.select.outputs.windows }}
      mf4: ${{ steps.select.outputs.mf4 }}
      package: ${{ steps.select.outputs.package }}
      profile: ${{ steps.select.outputs.profile }}
      python_matrix: ${{ steps.select.outputs.python_matrix }}
      mf4_matrix: ${{ steps.select.outputs.mf4_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select required checks
        id: select
        # Public main requires all four Linux matrix contexts and Windows.
        run: python3 batterylog_research/ci_policy.py plan --full

  test:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "mypy==1.19.1" "ruff==0.17.0" types-PyYAML setuptools -r batterylog_research/requirements-can.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy --follow-imports=silent --ignore-missing-imports batterylog
      - run: python -m pip check
      - name: Run tests including real desktop widgets
        env:
          BATTERYLOG_REQUIRE_DESKTOP_TESTS: "1"
        run: xvfb-run -a python -m pytest -q --cov=batterylog --cov-report=term-missing --cov-fail-under=95
  minimum-runtime:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "numpy==1.26.0" "pandas==2.2.0" "PyYAML==6.0" "mypy==1.19.1" "ruff==0.17.0" types-PyYAML setuptools -r batterylog_research/requirements-can.txt
      - run: python -m pip check
      - name: Run tests including real desktop widgets
        env:
          BATTERYLOG_REQUIRE_DESKTOP_TESTS: "1"
        run: xvfb-run -a python -m pytest -q --cov=batterylog --cov-report=term-missing --cov-fail-under=95
  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" "mypy==1.19.1" "ruff==0.17.0" types-PyYAML setuptools -r batterylog_research/requirements-can.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy --follow-imports=silent --ignore-missing-imports batterylog
      - run: python -m pip check
      - name: Run tests including real desktop widgets
        env:
          BATTERYLOG_REQUIRE_DESKTOP_TESTS: "1"
        # Windows Tcl intermittently failed to read its libraries under per-test fd capture.
        run: python -m pytest -q --capture=sys --cov=batterylog --cov-report=term-missing --cov-fail-under=95
  mf4:
    needs: plan
    if: needs.plan.outputs.mf4 == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.mf4_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,mf4]"
      - run: python -m pip check
      - run: python -m pytest -q tests/test_mf4_integration.py tests/test_mf4_loader.py tests/test_failure_models_mf4.py
  package:
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    needs: plan
    if: needs.plan.outputs.package == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine PyYAML packaging
      - name: Check release version
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_version.py
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Check archive paths and external-data exclusions
        run: python scripts/validation/check_distribution.py dist/*.tar.gz dist/*.whl
      - name: Verify source-distribution test corpus
        run: python scripts/check_sdist_test_fixtures.py dist/*.tar.gz
      - run: python -m twine check --strict dist/*
      - name: Audit unified package contents
        run: python scripts/check_experimental_package.py --artifacts dist
      - name: Validate base, CAN and MF4 installs of wheel and sdist outside checkout
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            env_dir=$(mktemp -d)
            python -m venv "$env_dir/venv"
            "$env_dir/venv/bin/python" -m pip install "$artifact" jsonschema
            "$env_dir/venv/bin/python" -m pip check
            (cd "$env_dir" && "$env_dir/venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed_package.py" "$version" "$GITHUB_WORKSPACE/examples/sample_battery_log.csv")
            (cd "$env_dir" && "$env_dir/venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_experimental_package.py" --installed)
            "$env_dir/venv/bin/python" -m pip install "${artifact}[mf4,can]" jsonschema
            "$env_dir/venv/bin/python" -m pip check
            (cd "$env_dir" && "$env_dir/venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed_mf4_package.py" "$version")
            (cd "$env_dir" && "$env_dir/venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_experimental_package.py" --installed)
          done
      - name: Compute checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  gate:
    name: BatteryLog CI gate
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: [plan, test, minimum-runtime, windows, mf4, package]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require every selected check to pass
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 batterylog_research/ci_policy.py gate

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [gate, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Publish verified tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${flags[@]}"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "batterylog"
version = "0.9.1"
description = "EV battery test-data analysis and validation toolkit"
readme = "README.md"
authors = [{ name = "Berk Ozfiliz" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["battery", "bms", "automotive", "ev", "validation"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/CANWECAN/BatteryLog"
Issues = "https://github.com/CANWECAN/BatteryLog/issues"

[project.scripts]
batterylog = "batterylog.__main__:main"

[project.optional-dependencies]
mf4 = [
  "asammdf>=8.8,<9",
]
dev = [
  "hypothesis>=6",
  "jsonschema>=4",
  "mypy>=1.18",
  "pytest>=9",
  "pytest-cov>=7",
  "psutil>=5.9",
  "ruff>=0.16",
]

[tool.setuptools.package-data]
batterylog = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

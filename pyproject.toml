[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "batterylog"
version = "0.11.0.dev0"
description = "EV battery test-data analysis and validation toolkit"
readme = "README.md"
authors = [{ name = "Berk Ozfiliz" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "batterylog_research/third_party_model3dbc_NOTICE.txt"]
requires-python = ">=3.11"
keywords = ["battery", "bms", "automotive", "ev", "validation"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "jsonschema>=4",
]

[project.urls]
Repository = "https://github.com/CANWECAN/BatteryLog"
Issues = "https://github.com/CANWECAN/BatteryLog/issues"

[project.scripts]
batterylog = "batterylog.__main__:main"
batterylog-gui = "batterylog.desktop:main"

[project.optional-dependencies]
can = [
  "cantools==44.2.1",
  "canmatrix==1.2",
  "python-can==4.6.1",
]
mf4 = [
  "asammdf>=8.8,<9",
  "canmatrix>=1.2,<1.3",
]
dev = [
  "hypothesis>=6",
  "mypy>=1.18",
  "pytest>=9",
  "pytest-cov>=7",
  "psutil>=5.9",
  "ruff>=0.16",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["batterylog", "batterylog.*", "batterylog_research"]
namespaces = false

[tool.setuptools.package-data]
batterylog = ["schema/*.json"]
batterylog_research = [
  "fixtures/*.csv",
  "fixtures/*.json",
  "can_model3_profile.json",
  "can_model3_multiplex_profile.json",
  "third_party_model3dbc_NOTICE.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
